name = "DifferentialGeometry"
version = "1.2.1"
keywords = ["math"]
defaultTargets = ["DifferentialGeometry", "DeclIndex"]
# Branch-local (codex/analytic-producers-e87b): short absolute build dir.
# The default .lake/build under this worktree's 63-char prefix pushes two deep
# spectral modules' artifact paths past Windows MAX_PATH (~260), which Lake's
# C-runtime cannot open (deterministic ENOENT on .olean.hash / .trace).
# Revert to the default before merging to a normally-located checkout.
buildDir = "C:/dgb2/e87b"

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
autoImplicit = false
linter.style.longLine = false
linter.unusedSectionVars = false
linter.style.emptyLine = false
linter.style.whitespace = false
linter.style.maxHeartbeats = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0"

[[lean_lib]]
name = "DifferentialGeometry"

# Declaration index: a bare `lake build` regenerates DECLS.ndjson (the generated
# index is gitignored); the targeted `lake build DifferentialGeometry` does NOT
# build this, so the proof-fill loop pays no indexing cost.
[[lean_lib]]
name = "DeclIndex"
globs = ["DeclIndex"]
