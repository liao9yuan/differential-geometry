name: Lean Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Project
    runs-on: 
      - self-hosted
      - macOS
      - ARM64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install elan and Lean 4.29
        run: |
          curl -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          chmod +x elan-init.sh
          ./elan-init.sh -y --default-toolchain leanprover/lean4:v4.29.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build with Lake
        run: |
          lake exe cache get
          lake build

      - name: Run audit suite
        run: |
          bash Scripts/audit.sh

      - name: Check build warnings against allowlist
        run: |
          lake build DifferentialGeometry > /tmp/build.log 2>&1 || { cat /tmp/build.log; exit 1; }
          grep "warning" /tmp/build.log | sed -E 's/^warning: //' | sort > /tmp/warnings.txt
          if ! diff -u Scripts/warnings.allowlist /tmp/warnings.txt; then
            echo "FAIL: build warnings differ from the allowlist (add new warnings only with owner approval)"
            exit 1
          fi
